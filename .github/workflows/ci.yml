name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-ingestion:
    name: Test Ingestion Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # Use 3.11 for CI compatibility

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pyarrow duckdb python-dotenv pytest responses

      - name: Run ingestion tests
        run: |
          PYTHONPATH=$PWD pytest tests/ -v
        env:
          ALPHA_VANTAGE_API_KEY: test_key
          FRED_API_KEY: test_key

  dbt-build:
    name: Build and Test dbt Models
    runs-on: ubuntu-latest
    needs: test-ingestion
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core dbt-duckdb

      - name: Generate sample bronze data
        run: |
          python scripts/seed_ci_fixtures.py

      - name: Install dbt packages
        working-directory: dbt
        run: dbt deps

      - name: Seed company metadata
        working-directory: dbt
        run: dbt seed

      - name: Run snapshots
        working-directory: dbt
        run: dbt snapshot

      - name: Build silver models
        working-directory: dbt
        run: dbt run --select silver

      - name: Build gold models
        working-directory: dbt
        run: dbt run --select gold

      - name: Run tests
        working-directory: dbt
        run: dbt test

  sql-lint:
    name: Lint SQL Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install sqlfluff
        run: |
          pip install sqlfluff sqlfluff-templater-dbt

      - name: Lint SQL
        run: |
          sqlfluff lint dbt/models --dialect duckdb --exclude-rules L034,L029
